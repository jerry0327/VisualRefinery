name: Publish versioned release

on:
  workflow_run:
    workflows: ["Validate VisualRefinery"]
    types: [completed]

permissions:
  contents: write

jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Read release version
        id: version
        shell: bash
        run: |
          VERSION="$(python3 -c 'import json; print(json.load(open("plugin.json"))["version"])')"
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Stop if this version already exists
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $TAG already exists; nothing to publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build portable skill package
        if: steps.exists.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          PKG="VisualRefinery-v${VERSION}"
          mkdir -p "dist/${PKG}/skills"
          cp plugin.json LICENSE README.md "dist/${PKG}/"
          cp -R skills/visual-refinery "dist/${PKG}/skills/"
          (
            cd dist
            zip -qr "visual-refinery-v${VERSION}.zip" "$PKG"
            sha256sum "visual-refinery-v${VERSION}.zip" > SHA256SUMS.txt
          )

      - name: Create version tag
        if: steps.exists.outputs.exists == 'false'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "VisualRefinery $TAG" "${{ github.event.workflow_run.head_sha }}"
            git push origin "$TAG"
          fi

      - name: Publish GitHub Release
        if: steps.exists.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          NOTES="docs/releases/${TAG}.md"
          if [[ -f "$NOTES" ]]; then
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "VisualRefinery ${TAG}" \
              --notes-file "$NOTES" \
              "dist/visual-refinery-v${VERSION}.zip" \
              "dist/SHA256SUMS.txt"
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "VisualRefinery ${TAG}" \
              --generate-notes \
              "dist/visual-refinery-v${VERSION}.zip" \
              "dist/SHA256SUMS.txt"
          fi
