<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light"><title>CAMRY / 乙式車險研究室</title><style>html,body{margin:0;min-height:100%;background:#f2efe8;color:#171715;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}body{display:grid;place-items:center}.boot{padding:32px;text-align:center}.boot b{display:block;font-family:serif;font-size:28px;margin-bottom:8px}.boot small{color:#6c6962}</style></head><body><div class="boot"><b>CAMRY / INSURANCE LAB</b><small>載入互動研究網站…</small></div><script>(async()=>{try{if(!('DecompressionStream'in window))throw new Error('unsupported');const names=['p0.txt','p1.txt','p2.txt','p3.txt'];const parts=await Promise.all(names.map(async n=>{const r=await fetch(n,{cache:'force-cache'});if(!r.ok)throw new Error(n);return r.text()}));const bin=atob(parts.join(''));const u8=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);const ds=new DecompressionStream('gzip');const text=await new Response(new Blob([u8]).stream().pipeThrough(ds)).text();document.open();document.write(text);document.close()}catch(e){document.body.innerHTML='<div class="boot"><b>無法載入研究網站</b><small>請使用最新版 Chrome、Edge、Safari 或 Firefox 開啟。</small></div>'}})();</script></body></html>
